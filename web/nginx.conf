# Serve the SPA and fall back to index.html, for client-side screen switching
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy Socket.IO (incl. the websocket upgrade) to the signaling server,
  # for same-origin signaling so it works behind an HTTPS tunnel without mixed-content
  location /socket.io/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Long read timeout so idle websocket connections are not dropped mid-game
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri /index.html;
  }
}
